name: GPT Independent US Prospective Validation

on:
  workflow_dispatch:
  schedule:
    # One year-round trigger. 21:20 UTC is 16:20 EST and 17:20 EDT,
    # so it is always safely after the regular US close without exact-minute gating.
    - cron: "20 21 * * 1-5"

permissions:
  contents: write

jobs:
  freeze-us:
    runs-on: ubuntu-latest
    concurrency:
      group: gpt-independent-us-freeze
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: pip install -r finlab_v2/requirements.txt
      - name: Run state-break smoke tests
        run: python finlab_v2/risk_transition_smoke.py
      - name: Build fail-closed decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/triaid-freeze
          python gpt_async_validation/us_independent_runner.py --output /tmp/triaid-freeze/decision.json \
            | tee /tmp/triaid-freeze/status.jsonl
      - name: Create immutable decision and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/triaid-freeze/decision.json
          T0="$(python -c 'import json;print(json.load(open("/tmp/triaid-freeze/decision.json"))["t0_trade_date"])')"
          PATH_IN_REPO="gpt_async_validation/ledger/US/$T0/decision.json"
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" >/dev/null 2>&1; then
            echo "Existing immutable freeze found. Verifying exact readback."
          else
            CONTENT="$(base64 -w0 /tmp/triaid-freeze/decision.json)"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" \
              -f message="Freeze independent US prospective decision $T0" \
              -f content="$CONTENT" \
              -f branch="${GITHUB_REF_NAME}" >/tmp/triaid-freeze/create-response.json
          fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" >/tmp/triaid-freeze/readback.json
          python - <<'PY'
          import base64,hashlib,json
          local=open("/tmp/triaid-freeze/decision.json","rb").read()
          remote=json.load(open("/tmp/triaid-freeze/readback.json"))
          got=base64.b64decode(remote["content"])
          if got != local:
              raise SystemExit("UNFROZEN: immutable readback mismatch")
          receipt={
              "status":"VALID_FROZEN",
              "decision_blob_sha":remote["sha"],
              "decision_bytes_sha256":hashlib.sha256(got).hexdigest(),
              "path":remote["path"],
          }
          open("/tmp/triaid-freeze/freeze_receipt.json","w").write(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt))
          PY
      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-independent-us-${{ github.run_id }}
          path: /tmp/triaid-freeze/
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce green-means-frozen contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/triaid-freeze/freeze_receipt.json
          python - <<'PY'
          import json
          receipt=json.load(open("/tmp/triaid-freeze/freeze_receipt.json"))
          if receipt.get("status") != "VALID_FROZEN":
              raise SystemExit("WORKFLOW_INCOMPLETE: freeze receipt is not VALID_FROZEN")
          print("GREEN_MEANS_FROZEN", receipt["path"], receipt["decision_bytes_sha256"])
          PY
