name: TRIAID FIN v2 Full Audit CI

on:
  push:
    branches:
      - main
      - backend-full-audit-20260921
    paths:
      - "finlab_v2/**"
      - ".github/workflows/finlab-v2-audit.yml"
  pull_request:
    paths:
      - "finlab_v2/**"
      - ".github/workflows/finlab-v2-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TRIAID_STORAGE_BACKEND: file
      TRIAID_DATA_DIR: /tmp/triaid-fin-v2-ci
      TRIAID_ADMIN_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r finlab_v2/requirements.txt
      - name: Compile standalone runtime
        run: python -m py_compile finlab_v2/standalone/run_triaid_fin.py
      - name: Verify standalone health semantics
        run: |
          PYTHONPATH=finlab_v2 python - <<'PY'
          from standalone.run_triaid_fin import classify_overall_status

          healthy = classify_overall_status(
              [{"market":"US","action":"EXECUTED"},{"market":"CN","action":"NO_FREEZE"}],
              {"integrity_ok":True},
          )
          degraded = classify_overall_status(
              [{"market":"US","action":"FAILED"},{"market":"CN","action":"EXECUTED"}],
              {"integrity_ok":True},
          )
          failed = classify_overall_status(
              [{"market":"US","action":"FAILED"},{"market":"CN","action":"FAILED"}],
              {"integrity_ok":True},
          )
          corrupt = classify_overall_status(
              [{"market":"US","action":"EXECUTED"}],
              {"integrity_ok":False},
          )
          assert healthy["status"] == "HEALTHY", healthy
          assert degraded["status"] == "DEGRADED", degraded
          assert degraded["failed_markets"] == ["US"], degraded
          assert failed["status"] == "FAILED", failed
          assert corrupt["status"] == "FAILED", corrupt
          print("STANDALONE_HEALTH_SEMANTICS_OK")
          PY
      - name: Verify Windows dependency refresh contract
        run: |
          grep -q "requirements_sha256" finlab_v2/standalone/start_windows.bat
          grep -q "hashlib.sha256" finlab_v2/standalone/start_windows.bat
          grep -q "py -3" finlab_v2/standalone/start_windows.bat
          grep -q -- "--check" finlab_v2/standalone/start_windows.bat
      - name: Verify prediction horizon isolation
        working-directory: finlab_v2
        run: python prediction_adjustment_smoke.py
      - name: Run canonical release audit
        working-directory: finlab_v2
        run: python release_audit.py build

  standalone-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real Windows standalone launcher check
        shell: cmd
        run: finlab_v2\standalone\start_windows.bat --check
