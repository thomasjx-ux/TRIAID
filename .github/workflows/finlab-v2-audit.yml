name: TRIAID FIN v2 Full Audit CI

on:
  push:
    branches:
      - main
      - backend-full-audit-20260921
    paths:
      - "finlab_v2/**"
      - ".github/workflows/finlab-v2-audit.yml"
  pull_request:
    paths:
      - "finlab_v2/**"
      - ".github/workflows/finlab-v2-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TRIAID_STORAGE_BACKEND: file
      TRIAID_DATA_DIR: /tmp/triaid-fin-v2-ci
      TRIAID_ADMIN_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r finlab_v2/requirements.txt
      - name: Compile optimized runtime entrypoints
        working-directory: finlab_v2
        run: |
          python -m py_compile \
            standalone_runtime.py \
            stateaware_app.py \
            triaid_fin/runtime_engine.py \
            triaid_fin/state_break.py \
            triaid_fin/exposure_control.py \
            triaid_fin/us_route_guard.py
          python standalone_runtime.py --help >/dev/null
      - name: Run fast-state regression
        working-directory: finlab_v2
        run: python state_break_smoke.py
      - name: Run underlying-exposure regression
        working-directory: finlab_v2
        run: python exposure_guard_smoke.py
      - name: Run canonical release audit
        working-directory: finlab_v2
        run: python release_audit.py build
